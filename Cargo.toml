[workspace]
resolver = "2"
members = ["crates/brujula-core", "crates/brujula"]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/danielmigueltejedor/brujula"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
