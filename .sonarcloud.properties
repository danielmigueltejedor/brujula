# SonarCloud automatic analysis settings.
#
# third-party/ holds vendored libraries (highlight.js, Readability, gvdb) that are reviewed
# upstream. style.css, style-elementary.css and the Rust shell's style.css are GTK CSS (node
# names such as "headerbar" and "row", GTK pseudo-classes, @define-color), which the generic
# CSS analyser reports as unknown. tests/data/ holds deliberately minimal HTML fixtures.
sonar.exclusions=third-party/**,src/resources/style.css,src/resources/style-elementary.css,crates/brujula/src/style.css,tests/data/**
