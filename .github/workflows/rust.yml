name: Rust
on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: brujula-core and brujula-passkeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      # The passkeys crate talks to the phone over D-Bus (Bluetooth) and reads hidraw, which
      # takes the headers of both.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev libudev-dev pkg-config
      # The UI crate needs GTK 4.20+ and WebKitGTK 6.0, which this runner does not have, so only
      # the UI-free crates are built and tested here.
      - name: Clippy
        run: cargo clippy -p brujula-core -p brujula-passkeys --all-targets -- -D warnings
      - name: Test
        run: cargo test -p brujula-core -p brujula-passkeys
