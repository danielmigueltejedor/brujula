name: Rust
on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: brujula-core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      # The UI crate needs GTK 4.20+ and WebKitGTK 6.0, which this runner does not have, so only
      # the UI-free crate is built and tested here.
      - name: Clippy
        run: cargo clippy -p brujula-core --all-targets -- -D warnings
      - name: Test
        run: cargo test -p brujula-core
